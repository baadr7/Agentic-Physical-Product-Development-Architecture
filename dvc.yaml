stages:
  prepare:
    cmd: python scripts/prepare_data.py
    deps:
      - data/raw
    outs:
      - data/processed
  train:
    cmd: python scripts/train_model.py
    deps:
      - data/processed
      - models/src
    outs:
      - models/artifacts
  evaluate:
    cmd: python scripts/evaluate.py
    deps:
      - models/artifacts
    metrics:
      - metrics/eval.json
