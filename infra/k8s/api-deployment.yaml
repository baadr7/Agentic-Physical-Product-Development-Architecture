apiVersion: apps/v1
kind: Deployment
metadata:
  name: makerkit-api
  labels:
    app: makerkit-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: makerkit-api
  template:
    metadata:
      labels:
        app: makerkit-api
    spec:
      containers:
        - name: api
          image: makerkit/api:latest
          ports:
            - containerPort: 8000
          env:
            - name: JWT_REQUIRED
              value: "1"
            - name: RATE_LIMIT_MAX_REQUESTS
              value: "60"
            - name: MLFLOW_TRACKING_URI
              valueFrom:
                secretKeyRef:
                  name: makerkit-secrets
                  key: mlflow_uri
            - name: SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: makerkit-secrets
                  key: supabase_url
            - name: SUPABASE_KEY
              valueFrom:
                secretKeyRef:
                  name: makerkit-secrets
                  key: supabase_key
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: makerkit-api
spec:
  selector:
    app: makerkit-api
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
