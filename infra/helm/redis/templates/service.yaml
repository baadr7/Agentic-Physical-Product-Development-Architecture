apiVersion: v1
kind: Service
metadata:
  name: {{ include "makerkit-redis.fullname" . }}
  labels:
    app: {{ include "makerkit-redis.name" . }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ include "makerkit-redis.name" . }}
    release: {{ .Release.Name }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 6379
      protocol: TCP
      name: redis
