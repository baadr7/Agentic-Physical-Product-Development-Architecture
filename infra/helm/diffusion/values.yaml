image:
  repository: makerkit/diffusion
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 8080

gpu:
  enabled: true
  resourceName: nvidia.com/gpu
  count: 1

resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 200m
    memory: 1Gi

env:
  LOG_LEVEL: info
  ENABLE_CONTROLNET: "0"

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: diffusion.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
