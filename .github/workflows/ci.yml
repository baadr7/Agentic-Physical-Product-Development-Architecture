name: CI

on:
  push:
    branches: [ main, master, topopt-work ]
  pull_request:
    branches: [ '*' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install JS dependencies (pnpm)
        run: pnpm install

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f apps/api/requirements.txt ]; then pip install -r apps/api/requirements.txt; fi

      - name: Run API tests
        working-directory: ./apps/api
        run: python -m pytest -q

      - name: Run web lint (best-effort)
        run: |
          if [ -f apps/web/package.json ]; then pnpm --filter web run lint || true; fi
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.10, 3.11]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements-dev.txt
          pip install PyJWT requests pillow numpy fakeredis
      - name: Run pytest (apps/api)
        run: |
          pytest apps/api/tests -q

  fem-smoke:
    name: FEM smoke-run (mocked uploader)
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install deps for smoke
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements-dev.txt
          pip install PyJWT requests pillow numpy fakeredis
      - name: Run FEM smoke script
        env:
          SUPABASE_URL: https://supabase.test
          SUPABASE_KEY: testkey
        run: |
          python apps/api/tests/run_fem_task_smoke.py

  topopt-smoke:
    name: TopOpt smoke
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/api/requirements.txt || true
          python -m pip install -r apps/api/requirements-dev.txt || true
      - name: Run TopOpt smoke
        run: |
          python -m pytest apps/api/tests/test_topopt_task_upload.py -q || true