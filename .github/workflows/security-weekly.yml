name: Weekly Security & Backups

on:
  schedule:
    - cron: '0 3 * * 1'  # Mondays at 03:00 UTC
  workflow_dispatch: {}

jobs:
  weekly-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Python audit
        working-directory: apps/api
        run: |
          pip install pip-audit -q
          pip-audit -r requirements.txt || echo 'Python audit findings logged'
      - name: Node audit
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Install pnpm
        run: npm install -g pnpm@9
      - name: Install web deps
        run: pnpm install --filter web
      - name: pnpm audit
        run: pnpm audit || echo 'Node audit findings logged'
      - name: Backup artifact placeholder
        run: |
          mkdir -p backup
          echo "Backup placeholder $(date -u)" > backup/README.txt
      - name: Upload backup artifact
        uses: actions/upload-artifact@v3
        with:
          name: weekly-backup
          path: backup
